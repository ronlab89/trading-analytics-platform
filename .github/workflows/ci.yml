name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trading_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Test variables mirror .env.test.example. The test scripts run through
    # `dotenv -e ../../.env.test.local`; dotenv-cli skips a missing file and
    # keeps the variables already in the environment, so no file is generated.
    env:
      NODE_ENV: test
      # Runtime role (DML only) for the API and the test suites; the migration
      # role (postgres) owns the schema and is used by `migrate deploy` only.
      DATABASE_URL: postgresql://trading_runtime:ci_runtime_password@localhost:5432/trading_test?schema=public
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trading_test?schema=public
      RUNTIME_DB_PASSWORD: ci_runtime_password
      JWT_SECRET: test_only_secret_at_least_32_characters_long
      JWT_EXPIRES_IN_SECONDS: "900"
      CORS_ORIGIN: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @trading/database db:generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm docs:check
      - run: pnpm test:scripts
      - run: pnpm --filter @trading/database db:test:migrate
      - run: pnpm --filter @trading/database db:test:runtime-password
      - run: pnpm test
      - run: pnpm build
