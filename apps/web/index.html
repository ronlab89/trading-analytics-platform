<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trading Analytics Platform</title>
    <!--
      The first paint, before any script or stylesheet of the app has loaded: the page color, the
      brand mark and the spinner of `SessionRestoring`, so the reload does not flash blank first.
      React replaces everything inside #root when it mounts. The values are literal on purpose: the
      design tokens are not loaded yet. Keep them in step with `session-restoring.tsx`.
    -->
    <style>
      html {
        background: #e9e9e7;
      }
      body {
        margin: 0;
      }
      .boot {
        box-sizing: border-box;
        display: flex;
        min-height: 100dvh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        padding: 24px;
      }
      .boot-wait {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        color: #6b6863;
      }
      .boot-spinner {
        animation: boot-spin 1s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" aria-hidden="true">
        <svg
          width="40"
          height="40"
          viewBox="0 0 28 28"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M0 6C0 2.68629 2.68629 0 6 0H22C25.3137 0 28 2.68629 28 6V22C28 25.3137 25.3137 28 22 28H6C2.68629 28 0 25.3137 0 22V6Z"
            fill="url(#boot-gradient)"
          />
          <path
            d="M17 10.25H21.5V14.75"
            stroke="#262524"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M21.5 10.25L15.125 16.625L11.375 12.875L6.5 17.75"
            stroke="#262524"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <defs>
            <linearGradient
              id="boot-gradient"
              gradientUnits="userSpaceOnUse"
              x1="3.28224"
              x2="24.3222"
              y1="4.75503"
              y2="23.2702"
            >
              <stop stop-color="#FDBD74" />
              <stop offset="1" stop-color="#F2600C" />
            </linearGradient>
          </defs>
        </svg>
        <div class="boot-wait">
          <svg
            class="boot-spinner"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 12a9 9 0 1 1-6.219-8.56" />
          </svg>
          <div style="height: 20px"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
